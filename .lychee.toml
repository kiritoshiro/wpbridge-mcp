# Link checker configuration (lychee). Used by .github/workflows/links.yml.
max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 16
# 429: rate limited, not broken.
accept = ["200..=299", "429"]
exclude_all_private = true
exclude_path = ["node_modules", "vendor", "dist", "build", "public/build"]
exclude = [
  # The sites behind Cloudflare bot protection answer GitHub runners with 403.
  '^https?://([a-z0-9-]+\.)*adventistai\.lt',
  # Placeholders and examples.
  '^https?://(www\.)?example\.(com|org|net|test|invalid)',
  '\.(test|invalid|local|localhost)([:/]|$)',
  '^https?://127\.0\.0\.1',
  '^https?://localhost',
]

name: Bridge checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PUBLIC_BASE_URL: https://example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax validation
        run: npm run check
      - name: Instruction size validation
        run: npm run check:instructions
      - name: Automated tests
        run: npm test
      - name: Render and verify OpenAPI schema
        run: npm run render-openapi && npm run check:openapi
        shell: bash
      - name: Failure environment summary
        if: failure()
        shell: bash
        run: |
          echo "Runner: $RUNNER_OS; Node: $(node --version); npm: $(npm --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "Run the Debug tests workflow with the affected suite for stack traces." >> "$GITHUB_STEP_SUMMARY"

  php:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate WordPress helper syntax
        run: |
          php -l wordpress/wpbridge-seo-helper/wpbridge-seo-helper.php
          php -l wordpress/wpbridge-alps-helper/wpbridge-alps-helper.php
          php -l wordpress/wpbridge-mec-helper/wpbridge-mec-helper.php
          php -l wordpress/wpbridge-control/wpbridge-control.php

name: Failure triage

on:
  workflow_run:
    workflows:
      - Bridge checks
      - Security and workflow checks
      - CodeQL
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  summarize:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_NAME: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          {
            echo "## $SOURCE_NAME failed"
            echo ""
            echo "Source run: $SOURCE_URL"
            echo ""
            echo "Failed or timed-out jobs:"
            gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" --paginate --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- " + .name + " (" + .conclusion + ")"'
          } >> "$GITHUB_STEP_SUMMARY"

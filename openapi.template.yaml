          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expected_seo_sha256
              properties:
                expected_seo_sha256:
                  type: string
                  minLength: 64
                  maxLength: 64
                  description: Fingerprint returned by the latest getPageSeo call.
                title:
                  type: string
                  maxLength: 1000
                description:
                  type: string
                  maxLength: 3000
                focus_keyword:
                  type: string
                  maxLength: 1000
                canonical_url:
                  type: string
                  maxLength: 2048
                  description: Absolute HTTP(S) URL, or an empty string to clear.
                og_title:
                  type: string
                  maxLength: 1000
                og_description:
                  type: string
                  maxLength: 3000
      responses:
        '200':

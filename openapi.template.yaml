          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              anyOf:
              - required:
                - expected_modified_gmt
              - required:
                - expected_content_sha256
              properties:
                expected_modified_gmt:
                  type: string
                  maxLength: 40
                  description: Exact modified_gmt value from the latest full item read.
                expected_content_sha256:
                  type: string
                  pattern: ^[A-Fa-f0-9]{64}$
                  description: SHA-256 fingerprint from the latest full item read.
                preview_token:
                  type: string
                  maxLength: 4096
                  description: Optional signed token returned by the matching preview operation. If supplied, the bridge rejects the write if the item version or proposed payload differs from that preview.
                title:
                  type: string
                  maxLength: 500
                content:
                  type: string
                  description: Full replacement WordPress post body.
                excerpt:
                  type: string
                slug:
                  type: string
                category_ids:
                  type: array
                  items:
                    type: integer
                tag_ids:
                  type: array
                  items:
                    type: integer
                featured_media:
                  type: integer
                  minimum: 0
                featured_image_id:
                  type: integer
                  minimum: 0
                alps:
                  type: object
                  additionalProperties: false
                  properties:
                    large_banner:
                      type: string
                      enum: [none, hero_50_50, image_text_overlay]
                    hide_featured_image:
                      type: boolean
                expected_alps_sha256:
                  type: string
                  pattern: ^[A-Fa-f0-9]{64}$
                author_id:
                  type: integer
                  minimum: 1
                  description: WordPress author ID resolved with listAuthors/getAuthor. Custom post types must declare author support.
      responses:
        '200':

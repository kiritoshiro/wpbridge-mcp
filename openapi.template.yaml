    patch:
      operationId: updatePageSeo
      summary: Update allowlisted SEO metadata for a WordPress page.
      description: 'Updates only explicitly supplied SEO fields through the restricted WordPress helper. Requires the current seo_sha256 returned by getPageSeo; stale writes are rejected. Published pages require ALLOW_LIVE_EDITS=true. This does not expose arbitrary post meta.

        '
      parameters:
      - name: page_id
        in: path

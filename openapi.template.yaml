  /v1/media/from-chatgpt:
    post:
      operationId: uploadConversationImages
      x-gpt-direct: true
      x-openai-isConsequential: true
      summary: Upload images or extract them from DOCX/ZIP files.
      description: 'Uploads conversation images and images extracted from DOCX or ZIP attachments. Large images return a no-write optimization recommendation; after approval, retry with optimize. DOCX extraction reads only word/media. Arbitrary URLs are rejected.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - openaiFileIdRefs
              - idempotency_key
              properties:
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                  description: 1-10 JPEG, PNG, WebP, GIF, DOCX, or ZIP attachments. Images inside DOCX/ZIP files are extracted automatically. ChatGPT supplies runtime file-reference objects.
                idempotency_key:
                  type: string
                  minLength: 8
                  maxLength: 200
                  pattern: ^[A-Za-z0-9._:-]+$
                  description: Fresh unique key for this logical batch. Reuse only for an identical retry. After accepting an optimization recommendation, use a fresh key for the changed optimize request.
                optimization_mode:
                  type: string
                  enum:
                  - ask
                  - optimize
                  - original
                  default: ask
                  description: Use ask by default. It uploads ordinary web-sized files but returns a no-write recommendation for large images. Use optimize only after user approval to resize and convert recommended JPEG/PNG/WebP images to WebP. Use original only when explicitly requested.
      responses:
        '201':
          description: Every image uploaded successfully.
        '207':
          description: Some images uploaded while other independent uploads failed or have unknown outcomes.
        '409':
          description: No images uploaded because optimization is recommended, or the idempotency key conflicts.
        '413':
          description: A source, batch, or prepared image exceeds a configured byte limit.
  /v1/media:
    get:
      operationId: listMedia
      summary: List or search image attachments in the WordPress Media Library.
      description: Only image attachments are returned.
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: Matching image media items.
    post:
      operationId: uploadMedia
      summary: Upload an image to the WordPress Media Library.
      description: 'Uploads caller-supplied image bytes encoded as raw base64. The bridge does not fetch remote URLs. Supported MIME types are JPEG, PNG, WebP, and GIF. Requires an idempotency key; if a write timeout has an unknown outcome, reusing the same key replays that unknown result instead of blindly uploading again. Use the returned media ID as featured_media or insert the returned source_url into WordPress content when appropriate.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - filename
              - mime_type
              - data_base64
              - idempotency_key
              properties:
                idempotency_key:
                  type: string
                  minLength: 8
                  maxLength: 200
                  pattern: ^[A-Za-z0-9._:-]+$
                  description: Stable unique key for this logical creation/upload/reply. Reuse the same key only when retrying the exact same request.
                filename:
                  type: string
                  maxLength: 240
                  description: Image filename. Extension must match the MIME type if supplied.
                mime_type:
                  type: string
                  enum:
                  - image/jpeg
                  - image/png
                  - image/webp
                  - image/gif
                data_base64:
                  type: string
                  description: Raw base64 image data only; do not include a data URL prefix.
                title:
                  type: string
                  maxLength: 500
                alt_text:
                  type: string
                caption:
                  type: string
                description:
                  type: string
                attached_to:
                  type: integer
                  minimum: 0
                  description: Optional WordPress post/page ID to associate the attachment with.
      responses:
        '201':
          description: Image uploaded and Media Library metadata returned.
        '413':
          description: Request or decoded image exceeds configured limits.
  /v1/media/{media_id}:
    get:
      operationId: getMedia
      summary: Read image attachment metadata.
      parameters:

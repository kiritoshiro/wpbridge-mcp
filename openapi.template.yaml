      - name: stale_days
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 3650
          default: 30
      - name: include_seo
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Read-only editorial status and issue list.
        '403':
          description: Requested custom post type is not allowlisted.
  /v1/editorial/audit:
    get:
      operationId: auditEditorialContent
      summary: Audit one post type/status page for editorial gaps.
      description: 'Read-only paged audit with a configured overall deadline and bounded SEO-check concurrency. Reports heuristic issues such as missing title/content, supported featured image/excerpt, core post category/tag assignments, stale draft/pending age, and missing explicit SEO description when safe SEO access is available. A slow audit can return HTTP 206 with partial results and skipped_due_deadline. Missing fields can be intentional; this endpoint does not change them.

        '
      parameters:
      - name: post_type
        in: query
        required: false
        schema:
          type: string
          pattern: ^[a-z0-9_-]{1,20}$
          default: post
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - publish
          - draft
          - pending
          - private
          - future
          default: draft
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 25
          default: 20
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: stale_days
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 3650
          default: 30
      - name: include_seo
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: only_with_issues
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Complete audit results, issue counts, and pagination metadata.
        '206':
          description: Partial audit results because the configured overall audit deadline was reached.
        '403':
          description: Requested custom post type is not allowlisted.
  /v1/editorial/queue:
    get:
      operationId: getEditorialQueue
      summary: Show stale drafts, pending review, and scheduled content.
      description: 'Read-only editorial workflow queue. Core posts/pages are always inspected. Allowlisted custom post types can be included explicitly. Results are capped per post type to keep the bridge responsive.

        '
      parameters:
      - name: stale_days
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 3650
          default: 30
      - name: per_type
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
      - name: include_custom
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Read-only stale draft, pending-review, and schedule queues.
  /v1/seo/capabilities:
    get:
      operationId: getSeoCapabilities
      summary: Detect safe SEO metadata support.
      description: 'Checks whether the optional WPBridge SEO Helper is installed and which supported SEO provider is active. This action is read-only and never exposes arbitrary WordPress post meta.

        '
      responses:
        '200':
          description: SEO helper/provider availability and writable field names.
  /v1/posts/{post_id}/seo:
    get:
      operationId: getPostSeo
      summary: Read allowlisted SEO metadata for a WordPress post.
      description: 'Requires the optional WPBridge SEO Helper plugin. Returns only the fixed SEO field allowlist plus an seo_sha256 optimistic-lock fingerprint. Read this immediately before an SEO update.

        '
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Safe SEO metadata and fingerprint.
        '503':
          description: SEO helper is not installed.
    patch:
      operationId: updatePostSeo
      summary: Update allowlisted SEO metadata for a WordPress post.
      description: 'Updates only explicitly supplied SEO fields through the restricted WordPress helper. Requires the current seo_sha256 returned by getPostSeo; stale writes are rejected. Published posts require ALLOW_LIVE_EDITS=true. This does not expose arbitrary post meta.

        '
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expected_seo_sha256
              properties:
                expected_seo_sha256:
                  type: string
                  minLength: 64
                  maxLength: 64
                  description: Fingerprint returned by the latest getPostSeo call.
                title:
                  type: string
                  maxLength: 1000
                description:
                  type: string
                  maxLength: 3000
                focus_keyword:
                  type: string
                  maxLength: 1000
                canonical_url:
                  type: string
                  maxLength: 2048
                  description: Absolute HTTP(S) URL, or an empty string to clear.
                og_title:
                  type: string
                  maxLength: 1000
                og_description:
                  type: string
                  maxLength: 3000
      responses:
        '200':
          description: Updated SEO metadata and new fingerprint.
        '409':
          description: SEO metadata changed since it was read, or provider is unavailable/conflicted.
        '503':
          description: SEO helper is not installed.
  /v1/pages/{page_id}/seo:
    get:
      operationId: getPageSeo
      summary: Read allowlisted SEO metadata for a WordPress page.
      description: 'Requires the optional WPBridge SEO Helper plugin. Returns only the fixed SEO field allowlist plus an seo_sha256 optimistic-lock fingerprint. Read this immediately before an SEO update.

        '

                  type: string
                  pattern: ^[A-Fa-f0-9]{64}$
                  description: Current hash returned by getPost or listPostBlocks.
      responses:
        '200':
          description: Revision restored without changing post publication status.
        '409':
          description: Current content changed since it was read.

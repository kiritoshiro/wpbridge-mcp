  /v1/comments:
    get:
      operationId: listComments
      summary: List WordPress comments for moderation.
      description: 'Lists ordinary comments using a moderation-oriented status filter. Commenter IP addresses, email addresses, and user-agent strings are not returned by this bridge.

        '
      parameters:
      - name: status

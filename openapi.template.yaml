        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Image attachment metadata.
    patch:
      operationId: updateMedia
      summary: Edit image attachment metadata.
      description: 'Updates only metadata such as title, alt text, caption, description, or attachment parent. It does not replace image bytes and cannot delete media.

        '
      parameters:
      - name: media_id

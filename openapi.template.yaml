  /v1/posts/{post_id}/blocks:
    get:
      operationId: listPostBlocks
      summary: List top-level Gutenberg blocks in a post.
      description: 'Reads the post and parses its raw serialized Gutenberg content. Returns block indexes plus a content_sha256 value used for safe targeted edits. Classic/freeform HTML is represented as core/freeform.

        '
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        description: Zero-based top-level block index at which to start the page of results.
        schema:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
      - name: limit
        in: query
        required: false
        description: Number of block summaries to return. Use a small value with include_markup=true.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: include_markup
        in: query
        required: false
        description: Include complete serialized markup for the selected blocks. Limited to 10 blocks per response.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Bounded top-level block page, full content hash, and pagination metadata. Markup is omitted unless requested.
        '413':
          description: Requested serialized markup exceeds the bounded response budget.
        '422':
          description: Existing Gutenberg markup is malformed.
    patch:
      operationId: editPostBlock
      summary: Insert, replace, or explicitly remove one top-level post block.
      description: 'Fetches the current post, verifies expected_content_sha256 to prevent overwriting concurrent edits, then changes only the targeted top-level content unit. Published posts require ALLOW_LIVE_EDITS=true. block_markup must be exactly one serialized Gutenberg block. Removing a block additionally requires confirm=REMOVE_BLOCK.

        '
      parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - operation
              - expected_content_sha256
              properties:
                operation:
                  type: string
                  enum:
                  - insert_start
                  - insert_end
                  - insert_before
                  - insert_after
                  - replace
                  - remove
                expected_content_sha256:
                  type: string
                  pattern: ^[A-Fa-f0-9]{64}$
                  description: Hash returned by listPostBlocks or getPost.
                block_index:
                  type: integer
                  minimum: 0
                  description: Required for insert_before, insert_after, replace, and remove.
                block_markup:
                  type: string
                  maxLength: 250000
                  description: Required except for remove. Exactly one serialized Gutenberg block.
                confirm:
                  type: string
                  enum:
                  - REMOVE_BLOCK
                  description: Required only for remove.
      responses:
        '200':
          description: Updated post plus refreshed block list and content hash.
        '409':
          description: Content changed since it was read; read blocks again.
        '422':
          description: Existing or supplied Gutenberg markup is malformed.

                  description: Optional version from a prior read; if supplied and stale, preview returns 409.
                expected_content_sha256:
                  type: string
                  pattern: ^[A-Fa-f0-9]{64}$
                  description: Optional content fingerprint from a prior read; if supplied and stale, preview returns 409.
                title:

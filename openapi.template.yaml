      operationId: unpublishPage
      summary: Return a published or scheduled page to draft.
      description: 'CONSEQUENTIAL ACTION. Call only when the user explicitly asked to remove this specific page from public view or cancel its schedule.

        '
      parameters:
      - name: page_id
        in: path
